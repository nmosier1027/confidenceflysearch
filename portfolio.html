<style>
:root{
  --navy:#0C2E47;
  --navy-2:#123A57;
  --gold:#F4CA50;
  --blue:#07699A;
  --ink:#1a1a2e;
  --mute:#51607a;
  --rule:#e2e6ec;
  --tint:#f4f7fa;
  --max:760px;
  font-size:17px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Lexend',system-ui,sans-serif;font-weight:300;color:var(--ink);background:#fff;line-height:1.65}
a{color:var(--blue)}
.site-nav{display:flex;gap:1.4rem;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--rule);flex-wrap:wrap;background:#fff}
.site-nav .brand{font-family:'Montserrat',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.9rem;color:var(--navy);text-decoration:none;margin-right:auto}
.site-nav a:not(.brand){color:var(--ink);text-decoration:none;font-size:.92rem}
.site-nav a:hover{color:var(--blue)}
/* gate — navy hero like the site's dark sections */
#gate-wrap{background:var(--navy)}
#gate{max-width:460px;margin:0 auto;padding:13vh 1.5rem 14vh;text-align:center}
#gate .kicker{font-family:'Lora',serif;font-style:italic;color:var(--gold);font-size:1rem;margin:0 0 .5rem}
#gate h1{font-family:'Montserrat',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#fff;font-size:1.5rem;margin:0 0 .5rem}
#gate p{color:rgba(255,255,255,.75);font-size:.95rem}
#gate form{display:flex;gap:.6rem;margin-top:1.4rem}
#gate input{flex:1;padding:.75rem 1rem;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;font-size:1rem;font-family:'Lexend',sans-serif}
#gate input::placeholder{color:rgba(255,255,255,.5)}
#gate button{padding:.75rem 1.4rem;border:0;border-radius:8px;background:var(--gold);color:var(--navy);font-family:'Lexend',sans-serif;font-weight:600;font-size:1rem;cursor:pointer}
#gate button:hover{filter:brightness(1.05)}
#gate .err{color:#ffd9d4;font-size:.9rem;min-height:1.2em;margin-top:.7rem}
/* article */
main{max-width:var(--max);margin:0 auto;padding:2.5rem 1.5rem 4rem}
.portfolio .intro .kicker{font-family:'Lora',serif;font-style:italic;color:var(--blue);font-size:1.05rem;margin:0 0 .4rem}
.portfolio h1{font-family:'Montserrat',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);font-size:1.7rem;line-height:1.25;margin:0 0 .6rem}
.lede{font-size:1.06rem;color:var(--mute)}
.case{margin-top:3rem;padding-top:1.6rem;border-top:1px solid var(--rule)}
.case-num{font-family:'Montserrat',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.2em;color:var(--gold);background:var(--navy);padding:.25rem .6rem;border-radius:6px}
.case h2,.extras h2,.cta h2{font-family:'Montserrat',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--navy)}
.case h2{font-size:1.12rem;margin:.7rem 0 .15rem}
.case-meta{font-family:'Lora',serif;font-style:italic;color:var(--mute);font-size:.95rem;margin-top:0}
.result{background:var(--tint);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:.9rem 1.1rem}
.extras{margin-top:3rem;padding-top:1.6rem;border-top:1px solid var(--rule)}
.extras h2,.cta h2{font-size:1.1rem}
.extras ul{padding-left:1.2rem}
.extras li{margin-bottom:.6rem}
.cta{margin-top:3rem;padding:1.6rem 1.6rem;background:var(--navy);border-radius:12px;color:#fff}
.cta h2{color:#fff}
.cta a{color:var(--gold)}
.footnote{color:var(--mute);font-size:.88rem;margin-top:2.5rem;font-family:'Lora',serif;font-style:italic}
footer{border-top:1px solid var(--rule);color:var(--mute);font-size:.85rem;text-align:center;padding:1.5rem}
footer a{color:var(--blue)}
@media(max-width:600px){:root{font-size:16px}.portfolio h1{font-size:1.35rem}#gate h1{font-size:1.25rem}}
</style>
</head>

const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryUnlock(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b2u(SALT), iterations:310000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2u(IV)}, key, b2u(CT));
  return new TextDecoder().decode(pt);
}
document.getElementById('pwform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const html = await tryUnlock(document.getElementById('pw').value);
    document.getElementById('content').innerHTML = html;
    document.getElementById('content').hidden = false;
    document.getElementById('gate-wrap').remove();
  } catch {
    err.textContent = 'That code didn\u2019t work \u2014 double-check and try again.';
  }
});
